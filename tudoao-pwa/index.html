<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}
/* Chi tiết món đồ: ảnh nổi bật, thông tin phân cấp rõ và thao tác dễ chạm trên điện thoại */
.item-detail { display:flex; flex-direction:column; gap:16px; padding-bottom:12px; }
.item-visual { position:relative; height:clamp(250px, 42vh, 390px); min-height:250px; overflow:hidden; border:1px solid var(--line); border-radius:24px; display:flex; align-items:center; justify-content:center; background-color:var(--photo); }
.item-visual > img { width:100%; height:100%; object-fit:contain; padding:18px; }
.item-visual-label { position:absolute; left:14px; top:14px; padding:7px 11px; border-radius:999px; color:var(--ink); background:var(--surface); border:1px solid var(--line); font-size:11px; font-weight:700; box-shadow:var(--shadow); }
.item-hero-heart { position:absolute!important; right:14px; top:14px; background:var(--surface)!important; box-shadow:var(--shadow); }
.item-title-row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.item-title-row h2 { margin:3px 0 2px; font:700 24px/1.2 var(--f-display); letter-spacing:-.4px; }
.item-title-row .sub { margin:4px 0 0; }
.eyebrow { color:var(--primary); font-size:10px; letter-spacing:1.4px; font-weight:700; }
.item-color { width:25px; height:25px; flex:0 0 25px; border-radius:50%; border:3px solid var(--surface); outline:1px solid var(--line); }
.item-tags { display:flex; flex-wrap:wrap; gap:7px; }
.item-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.item-stats > div { min-width:0; display:flex; flex-direction:column; gap:5px; padding:12px 10px; border-radius:16px; background:var(--panel); }
.item-stats b { font-size:14px; line-height:1.25; overflow-wrap:anywhere; }
.item-stats small { font-size:10px; line-height:1.35; color:var(--muted); }
.stat-icon { display:flex; color:var(--primary); }
.stat-icon .i { width:17px; height:17px; }
.item-value { padding:14px 16px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
.item-value > span { color:var(--muted); font-size:12px; }
.item-value > b { float:right; font-size:15px; }
.item-value p { margin:7px 0 0; color:var(--muted); font-size:11px; }
.item-main-action { min-height:50px; border-radius:15px; }
.item-secondary-action { min-height:46px; border-radius:15px; }
.item-delete { margin-top:2px; }
.item-photo-actions { display:flex; gap:8px; margin-top:10px; }
.item-photo-actions .btn { flex:1; min-width:0; }
.trend-hint { display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:13px; background:var(--soft); color:var(--forest); font-size:12px; }
@media (max-width:380px) {
  .item-visual { height:240px; min-height:240px; }
  .item-title-row h2 { font-size:21px; }
  .item-stats { gap:6px; }
  .item-stats > div { padding:10px 7px; }
  .item-stats b { font-size:12px; }
  .item-stats small { font-size:9px; }
}

</style>
<title>Tủ Đồ Ảo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
<style>
/* Bố cục: một cột kích thước điện thoại, nền kem xanh, thẻ trắng bo tròn, thanh tab 5 mục với nút Thêm nổi ở giữa. Xanh sage là màu chính, xanh rừng đậm cho tiêu đề và banner. */
:root {
  --bg: #FAF9F4; --surface: #FFFFFF; --panel: #EBF1E8; --ink: #1D2A22; --muted: #66736A; --line: #E4E9DF;
  --primary: #55795A; --primary-ink: #FFFFFF; --soft: #DCE8D9; --forest: #1F4D32; --forest-ink: #FFFFFF;
  --warn: #86570B; --warn-soft: #F6E8CC; --danger: #A33A3A; --scrim: rgba(16, 28, 20, .45);
  --check-a: #FFFFFF; --check-b: #E9EDE6; --photo: #EFF1EA; --shadow: 0 6px 18px rgba(31, 77, 50, .08);
  --f-display: 'Lora', Georgia, 'Times New Roman', serif;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111915; --surface: #1A251E; --panel: #223027; --ink: #E7EFE8; --muted: #9AAA9E; --line: #2C3A31;
    --primary: #7FA683; --primary-ink: #0E1A12; --soft: #2B3D30; --forest: #B5DDB9; --forest-ink: #0E1A12;
    --warn: #E3B35C; --warn-soft: #3A2E14; --danger: #E58C8C; --scrim: rgba(0, 0, 0, .6);
    --check-a: #26352B; --check-b: #1F2C24; --photo: #223027; --shadow: 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111915; --surface: #1A251E; --panel: #223027; --ink: #E7EFE8; --muted: #9AAA9E; --line: #2C3A31;
  --primary: #7FA683; --primary-ink: #0E1A12; --soft: #2B3D30; --forest: #B5DDB9; --forest-ink: #0E1A12;
  --warn: #E3B35C; --warn-soft: #3A2E14; --danger: #E58C8C; --scrim: rgba(0, 0, 0, .6);
  --check-a: #26352B; --check-b: #1F2C24; --photo: #223027; --shadow: 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
/* Bảng màu có thể đổi trong Cài đặt */
:root[data-accent="sage"] { --primary:#55795A; --primary-ink:#FFFFFF; --soft:#DCE8D9; --forest:#1F4D32; }
:root[data-accent="rose"] { --primary:#B65370; --primary-ink:#FFFFFF; --soft:#F7DFE7; --forest:#793047; }
:root[data-accent="ocean"] { --primary:#287A9B; --primary-ink:#FFFFFF; --soft:#D9EDF5; --forest:#164B63; }
:root[data-accent="amber"] { --primary:#A86B17; --primary-ink:#FFFFFF; --soft:#F7E8CC; --forest:#70420B; }
:root[data-accent="violet"] { --primary:#7856A8; --primary-ink:#FFFFFF; --soft:#E9E0F5; --forest:#4A326F; }
:root[data-accent="coral"] { --primary:#D65F50; --primary-ink:#FFFFFF; --soft:#FBE3DE; --forest:#85382F; }
:root[data-accent="mint"] { --primary:#168B78; --primary-ink:#FFFFFF; --soft:#D8F3EC; --forest:#0C594E; }
:root[data-accent="navy"] { --primary:#3456A1; --primary-ink:#FFFFFF; --soft:#DFE7FA; --forest:#20396F; }
:root[data-accent="lavender"] { --primary:#9673D0; --primary-ink:#FFFFFF; --soft:#EEE5FC; --forest:#5C438A; }
:root[data-accent="chocolate"] { --primary:#8B5E3C; --primary-ink:#FFFFFF; --soft:#F1E2D5; --forest:#583923; }
:root[data-accent="slate"] { --primary:#596B7B; --primary-ink:#FFFFFF; --soft:#E1E8EF; --forest:#344553; }
:root[data-accent="lime"] { --primary:#658B2E; --primary-ink:#FFFFFF; --soft:#E8F2D6; --forest:#3B571B; }
:root[data-accent="berry"] { --primary:#A23B72; --primary-ink:#FFFFFF; --soft:#F7DFEC; --forest:#6C244B; }
:root[data-accent="coral"][data-theme="dark"] { --primary:#F08C7D; --primary-ink:#30110D; --soft:#4A2925; --forest:#FFC1B7; }
:root[data-accent="mint"][data-theme="dark"] { --primary:#69D3BD; --primary-ink:#092B25; --soft:#1D4039; --forest:#A5F0DF; }
:root[data-accent="navy"][data-theme="dark"] { --primary:#91ACF3; --primary-ink:#101D3B; --soft:#273552; --forest:#C3D2FF; }
:root[data-accent="lavender"][data-theme="dark"] { --primary:#C3A8F4; --primary-ink:#26183D; --soft:#3B2E51; --forest:#E0D0FF; }
:root[data-accent="chocolate"][data-theme="dark"] { --primary:#D2A27D; --primary-ink:#2D1C10; --soft:#403126; --forest:#EBD0B8; }
:root[data-accent="slate"][data-theme="dark"] { --primary:#A9BED0; --primary-ink:#17232D; --soft:#2D3B47; --forest:#D0E0EC; }
:root[data-accent="lime"][data-theme="dark"] { --primary:#B5D77C; --primary-ink:#1C2A0D; --soft:#344328; --forest:#D7F0AB; }
:root[data-accent="berry"][data-theme="dark"] { --primary:#E59AC2; --primary-ink:#351426; --soft:#48293B; --forest:#F4C0DE; }
/* Solid: tương phản rõ hơn, bề mặt chắc và điểm nhấn màu đậm */
:root[data-ui="solid"] { --panel:var(--soft); --shadow:0 8px 22px rgba(25,35,45,.12); }
:root[data-ui="solid"] .card, :root[data-ui="solid"] .pstat, :root[data-ui="solid"] .pstat, :root[data-ui="solid"] .item-value { border-color:color-mix(in srgb,var(--primary) 22%,var(--line)); }
:root[data-ui="solid"] .btn.primary, :root[data-ui="solid"] .tabs .active { box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 24%,transparent); }
:root[data-ui="solid"] .chip[aria-pressed="true"] { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }

:root[data-theme="dark"][data-accent="sage"] { --primary:#7FA683; --primary-ink:#0E1A12; --soft:#2B3D30; --forest:#B5DDB9; }
:root[data-theme="dark"][data-accent="rose"] { --primary:#E58BA5; --primary-ink:#32121D; --soft:#452633; --forest:#F0B6C7; }
:root[data-theme="dark"][data-accent="ocean"] { --primary:#78C3E0; --primary-ink:#09202B; --soft:#203945; --forest:#A7DDF1; }
:root[data-theme="dark"][data-accent="amber"] { --primary:#E7B768; --primary-ink:#2B1B05; --soft:#3A2E14; --forest:#F0D09A; }
:root[data-theme="dark"][data-accent="violet"] { --primary:#BDA0EA; --primary-ink:#20142F; --soft:#352943; --forest:#D6C2F4; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="coral"] { --primary:#F08C7D; --primary-ink:#30110D; --soft:#4A2925; --forest:#FFC1B7; }
  :root:not([data-theme="light"])[data-accent="mint"] { --primary:#69D3BD; --primary-ink:#092B25; --soft:#1D4039; --forest:#A5F0DF; }
  :root:not([data-theme="light"])[data-accent="navy"] { --primary:#91ACF3; --primary-ink:#101D3B; --soft:#273552; --forest:#C3D2FF; }
  :root:not([data-theme="light"])[data-accent="lavender"] { --primary:#C3A8F4; --primary-ink:#26183D; --soft:#3B2E51; --forest:#E0D0FF; }
  :root:not([data-theme="light"])[data-accent="chocolate"] { --primary:#D2A27D; --primary-ink:#2D1C10; --soft:#403126; --forest:#EBD0B8; }
  :root:not([data-theme="light"])[data-accent="slate"] { --primary:#A9BED0; --primary-ink:#17232D; --soft:#2D3B47; --forest:#D0E0EC; }
  :root:not([data-theme="light"])[data-accent="lime"] { --primary:#B5D77C; --primary-ink:#1C2A0D; --soft:#344328; --forest:#D7F0AB; }
  :root:not([data-theme="light"])[data-accent="berry"] { --primary:#E59AC2; --primary-ink:#351426; --soft:#48293B; --forest:#F4C0DE; }
  :root:not([data-theme="light"])[data-accent="rose"] { --primary:#E58BA5; --primary-ink:#32121D; --soft:#452633; --forest:#F0B6C7; }
  :root:not([data-theme="light"])[data-accent="ocean"] { --primary:#78C3E0; --primary-ink:#09202B; --soft:#203945; --forest:#A7DDF1; }
  :root:not([data-theme="light"])[data-accent="amber"] { --primary:#E7B768; --primary-ink:#2B1B05; --soft:#3A2E14; --forest:#F0D09A; }
  :root:not([data-theme="light"])[data-accent="violet"] { --primary:#BDA0EA; --primary-ink:#20142F; --soft:#352943; --forest:#D6C2F4; }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); color: var(--forest); text-wrap: balance; }
.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 112px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: none; }

/* Tiêu đề trang */
.hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-block: 6px 14px; }
.hd h1 { font-size: 30px; line-height: 1.15; }
.sub { color: var(--muted); font-size: 13px; }
.wx { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; font-size: 14px; margin-top: 4px; }
.wx svg.i { color: #D9A21B; width: 22px; height: 22px; }
.wx b { font-size: 16px; }
.wx span { color: var(--muted); }
.leaf-badge { width: 52px; height: 52px; border-radius: 50%; background: var(--soft); color: var(--forest); display: grid; place-items: center; flex: none; }
.leaf-badge svg.i { width: 26px; height: 26px; }
.deco { position: absolute; top: 0; right: 0; width: 160px; color: var(--primary); opacity: .14; pointer-events: none; }
.relative { position: relative; }

/* Nút */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 500; min-height: 42px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 600; }
.btn.soft { background: var(--soft); border-color: var(--soft); color: var(--forest); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 12px; min-height: 32px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.lg { min-height: 50px; font-size: 16px; justify-content: space-between; padding-inline: 20px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Chip */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 6px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-bottom: 0; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; white-space: nowrap; }
.chip svg.i { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--soft); color: var(--forest); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* Ô tìm kiếm */
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 16px; margin-bottom: 12px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 0; outline: none; color: var(--ink); }
.search .btn { border: 0; background: transparent; width: 38px; min-height: 38px; padding: 0; color: var(--muted); }

/* Hero outfit */
.hero { background: var(--panel); border-radius: 22px; padding: 14px; display: grid; gap: 12px; margin-bottom: 18px; position: relative; overflow: hidden; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); color: var(--forest); font-size: 12px; font-weight: 600; letter-spacing: .05em; border-radius: 999px; padding: 5px 12px; justify-self: start; }
.tag svg.i { width: 14px; height: 14px; }
.compose { display: grid; gap: 4px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.crow { display: flex; gap: 4px; justify-content: center; }
.cp { flex: 1; min-width: 0; display: grid; place-items: center; }
.crow.big .cp { height: 176px; }
.crow.small .cp { height: 84px; }
.cp svg, .cp img { max-width: 100%; max-height: 100%; width: auto; height: 100%; filter: drop-shadow(0 6px 7px rgba(0, 0, 0, .14)); }
.feat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border-radius: 16px; padding: 10px 4px; }
.feat > div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: center; padding: 2px 8px; border-right: 1px solid var(--line); }
.feat > div:last-child { border-right: 0; }
.feat svg.i { color: var(--primary); width: 22px; height: 22px; }
.feat b { display: block; font-size: 12px; font-weight: 600; line-height: 1.25; }
.feat small { display: block; font-size: 11px; color: var(--muted); line-height: 1.25; }
.sec-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.sec-row h2 { font-size: 20px; }
.link { background: none; border: 0; color: var(--muted); padding: 4px 0; display: inline-flex; align-items: center; gap: 2px; }
.alts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.alt { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; min-width: 0; }
.alt-img { background: var(--photo); display: flex; gap: 2px; justify-content: center; padding: 10px 6px; height: 112px; }
.alt-img .cp { height: 100%; }
.alt-body { padding: 10px; display: grid; gap: 6px; justify-items: start; }
.alt-body .sub { display: flex; align-items: center; gap: 4px; }
.alt-body .sub svg.i { width: 14px; height: 14px; color: var(--primary); }
.note { font-size: 13px; color: var(--muted); background: var(--panel); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }

/* Người mẫu và AI */
.stage { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.fig { width: 100%; max-height: 360px; display: block; }
.plist { display: grid; gap: 8px; min-width: 0; }
.pl { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pt { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; flex: none; border: 1px solid var(--line); }
.pt svg, .pt img { width: 86%; height: 86%; object-fit: contain; }
.pl span { font-size: 11px; color: var(--muted); min-width: 0; flex: 1; }
.pl b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aicard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 8px; margin-bottom: 14px; }
.ai-top { display: flex; align-items: center; gap: 8px; color: var(--forest); font-family: var(--f-display); font-size: 16px; }
.ai-top svg.i { color: var(--primary); }
.ai-row { display: flex; gap: 8px; }
.ai-row input { flex: 1; min-width: 0; min-height: 42px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; }
.ainote { background: var(--surface); border-radius: 14px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
.ainote b { color: var(--forest); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.ainote b svg.i { width: 15px; height: 15px; color: var(--primary); }

/* Tủ đồ */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.citem { position: relative; background: none; border: 0; padding: 0; text-align: left; min-width: 0; display: block; }
.ctile { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line); }
.checker { background: conic-gradient(var(--check-a) 25%, var(--check-b) 0 50%, var(--check-a) 0 75%, var(--check-b) 0) 0 0 / 16px 16px; }
.ctile svg, .ctile img { width: 86%; height: 86%; object-fit: contain; }
.citem .nm { font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem .mt { font-size: 11px; color: var(--muted); }
.heart { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .0); color: var(--muted); display: grid; place-items: center; padding: 0; }
.heart svg.i { width: 18px; height: 18px; }
.heart.on { color: var(--primary); }
.heart.on svg { fill: currentColor; }
.badge { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--primary); color: var(--primary-ink); z-index: 1; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.grey { background: rgba(70, 80, 74, .72); color: #fff; }

        var cx = c.getContext('2d'), im = cx.getImageData(0, 0, c.width, c.height);
        for (var q2 = 0; q2 < im.data.length; q2 += 4) im.data[q2 + 3] = mask[q2 + 3];
        cx.putImageData(im, 0, 0); draft.cut = true;
      }
    }
    // Chất lượng webp cao hơn một chút để giữ chi tiết vải
    draft.url = c.toDataURL('image/webp', 0.90);
    var col = avgColor(c);
    if (col && !draft.colorTouched) $('#f-color').value = col;
    var colv = $('#f-color').value;
    $('#res').innerHTML = '<span class="lbl">KẾT QUẢ SAU KHI LOẠI BỎ NỀN</span><div class="res" style="margin-top:6px"><div class="box checker"><img src="' + draft.url + '" alt="Ảnh món đồ sau khi xử lý"></div>' +
      '<div class="autotag"><h3>' + ic('spark') + 'Thẻ tự nhận diện</h3><div class="kv"><i style="background:' + esc(colv) + '"></i><span><small>Màu</small>Lấy từ ảnh</span></div><div class="kv"><i></i><span><small>Nền</small>' + (draft.cut ? 'Đã tách' : 'Giữ ảnh gốc') + '</span></div><div class="kv"><i></i><span><small>Loại, độ dày</small>Chọn bên dưới</span></div></div></div>';
    if (draft.cut) {
      $('#pv-status').textContent = 'Đã tách nền. Nếu còn sót nền hoặc bị cắt mất phần đồ → kéo thanh "Mức tách nền" sang trái/phải.';
    } else if (want) {
      $('#pv-status').textContent = 'Chưa tách sạch. Thử: nền tương phản rõ hơn, đồ nằm trọn khung, hoặc kéo thanh "Mức tách nền".';
    } else {
      $('#pv-status').textContent = 'Giữ nguyên ảnh gốc (không tách nền).';
    }
  }
  function saveItem() {
    var cat = $('#f-cat').value;
    var name = $('#f-name').value.trim() || CATS[cat].label + ' mới';
    var it = {
      id: uid(), name: name, brand: $('#f-brand').value.trim(), size: $('#f-size').value.trim(), cat: cat, gender: $('#f-gender').value || 'unisex', color: $('#f-color').value, warmth: +$('#f-warm').value, styles: draft.styles.slice(),
      price: Math.max(0, +$('#f-price').value || 0), wears: 0, lastWorn: null, photo: draft.url, listing: null, rain: $('#f-rain').checked, fav: false
    };
    S.items.unshift(it);
    if (save()) toast('Đã cất "' + name + '" vào tủ.');
    closeSheet(); S.filter = 'all'; S.q = ''; S.page = 'closet'; render();
  }

  /* ---------- Marketplace ---------- */
  function mcard(o, kind) {
    var cond = kind === 'explore' ? (o.cond >= 90 ? 'Như mới' : 'Tốt') : condOf(o);
    var priceTxt = o.mode === 'doi' ? 'Trao đổi' : vnd(o.mode === undefined ? 0 : o.price);
    var photo = kind === 'explore' ? garment(o.cat, o.color, o.name) : pic(o);
    var isFav = kind === 'explore' ? !!S.ofav[o.id] : false;
    return '<div class="mcard"><button class="mcard" style="padding:0;box-shadow:none;width:100%;background:none" data-act="' + (kind === 'explore' ? 'oview' : 'open') + '" data-id="' + o.id + '" aria-label="' + esc(o.name) + '"><div class="photo"><span class="badge ' + (cond === 'Tốt' ? 'grey' : '') + '">' + cond + '</span>' + photo + (kind === 'sold' ? '<span class="sold-tag">ĐÃ BÁN</span>' : '') + '</div><div class="nm">' + esc(o.name) + '</div><div class="br">' + esc(o.brand || '') + '</div></button>' +
      '<div class="pf"><span class="price num">' + (kind === 'sold' ? vnd(o.listing && o.listing.price || 0) : priceTxt) + '</span>' + (kind === 'explore' ? '<button class="heart ' + (isFav ? 'on' : '') + '" data-act="ofav" data-id="' + o.id + '" aria-label="Lưu">' + ic('heart') + '</button>' : '') + '</div></div>';
  }
  function marketGrid() {
    var q = S.mq.trim().toLowerCase(), t = S.mtab, list, kind = t === 'explore' ? 'explore' : t;
    var match = function (o) { return !q || (o.name + ' ' + (o.brand || '')).toLowerCase().indexOf(q) > -1; };
    if (t === 'mine') list = S.items.filter(function (i) { return i.listing; }).map(function (i) { return Object.assign({}, i, { mode: i.listing.mode, price: i.listing.price }); }).filter(match);
    else if (t === 'sold') list = S.sold.map(function (i) { return Object.assign({}, i, { mode: 'ban' }); }).filter(match);
    else list = OTHERS.filter(function (o) { return (S.mfilter === 'all' || o.mode === S.mfilter) && match(o); });
    if (!list.length) return '<div class="empty" style="grid-column:1/-1">' + (t === 'mine' ? 'Bạn chưa đăng món nào. Bấm "Bắt đầu" bên dưới để đăng món đầu tiên.' : t === 'sold' ? 'Chưa có món nào đã bán.' : 'Không có bài đăng nào khớp.') + '</div>';
    return list.map(function (o) { return mcard(o, kind); }).join('');
  }
  function renderMarket() {
    var stale = S.items.filter(function (i) { return isStale(i) && !i.listing; }).length;
    var leaves = '<svg class="deco" viewBox="0 0 160 120" aria-hidden="true"><g fill="currentColor"><path d="M150 10C120 12 95 30 88 62c28-2 52-20 62-52z"/><path d="M110 70C86 66 62 78 52 102c24 4 50-8 58-32z"/><path d="M156 52c-22 4-38 18-42 40 20-2 36-16 42-40z"/></g></svg>';
    return '<div class="relative">' + leaves + '<div class="hd" style="position:relative"><div><h1>Ký gửi &amp; Trao đổi</h1><p class="sub">Thời trang bền vững, cộng đồng xanh</p></div><span class="leaf-badge">' + ic('leaf') + '</span></div></div>' +
      '<div class="mtabs" role="tablist">' + [['mine', 'Đồ của tôi'], ['explore', 'Khám phá'], ['sold', 'Đã bán']].map(function (x) { return '<button role="tab" aria-selected="' + (S.mtab === x[0]) + '" data-act="mtab" data-t="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      '<div class="search">' + ic('search') + '<input id="mq" type="text" placeholder="Tìm kiếm đồ secondhand..." value="' + esc(S.mq) + '" aria-label="Tìm kiếm đồ secondhand"><span class="btn" style="display:grid;place-items:center">' + ic('sliders') + '</span></div>' +
      (S.mtab === 'explore' ? '<div class="chips" role="group" aria-label="Lọc hình thức">' + [['all', 'Tất cả'], ['ban', 'Bán'], ['doi', 'Trao đổi'], ['kygui', 'Ký gửi']].map(function (x) { return '<button class="chip" aria-pressed="' + (S.mfilter === x[0]) + '" data-act="mf" data-f="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' : '') +
      '<div class="mgrid" id="mgrid">' + marketGrid() + '</div>' +
      '<div class="cta"><span class="ic">' + ic('tag') + '</span><div class="tx"><b>Đăng bán ngay</b><small>' + (stale ? stale + ' món lâu chưa mặc đang chờ bạn' : 'Ký gửi dễ dàng, trao đổi ý nghĩa') + '</small></div><button class="btn sm" data-act="startlist">Bắt đầu ' + ic('chev').replace('class="i "', 'class="i" style="width:14px;height:14px"') + '</button></div>' +
      '<p class="sub" style="margin-top:12px">Ký gửi: cửa hàng đối tác bán hộ và giữ một phần tiền bán được, mức phí do từng cửa hàng đặt ra. Bài đăng ở mục Khám phá là dữ liệu mẫu.</p>';
  }
  function startListSheet() {
    var c = S.items.filter(function (i) { return !i.listing; }).sort(function (a, b) { return idle(b) - idle(a); });
    openSheet(shHead('Chọn món để đăng') + (c.length ? '<div class="list" style="margin:0">' + c.map(function (i) {
      return '<button class="lrow" style="text-align:left;width:100%" data-act="openlist" data-id="' + i.id + '"><div class="th checker">' + pic(i) + '</div><div class="tx"><b>' + esc(i.name) + '</b><span class="sub">' + (since(i.lastWorn) === null ? 'Chưa mặc lần nào' : 'Mặc gần nhất: ' + sinceText(i.lastWorn)) + '</span></div>' + ic('chev') + '</button>';
    }).join('') + '</div>' : '<div class="empty">Tủ đồ trống hoặc mọi món đã được đăng.</div>'));
  }
  function oviewSheet(id) {
    var o = OTHERS.filter(function (x) { return x.id === id; })[0]; if (!o) return;
    openSheet(shHead(o.name, true) +
      '<div class="big-tile" style="background:var(--photo)">' + garment(o.cat, o.color, o.name) + '</div>' +
      '<div class="row"><span class="pill">' + MODES[o.mode] + '</span><span class="pill">' + (o.cond >= 90 ? 'Như mới' : 'Tốt') + ' · còn ' + o.cond + '%</span><span class="pill">Size ' + esc(o.size) + '</span></div>' +
      '<div><div class="price num" style="font-size:22px">' + (o.mode === 'doi' ? 'Muốn đổi lấy: ' + esc(o.wish) : vnd(o.price)) + '</div><p class="sub">' + esc(o.brand) + ' · ' + esc(o.place) + ' · Người đăng: ' + esc(o.who) + '</p></div>' +
      '<div class="acts"><button class="btn primary" data-act="msg" data-who="' + esc(o.who) + '">Nhắn ' + esc(o.who) + '</button><button class="btn" data-act="ofav" data-id="' + o.id + '" data-keep="1">' + ic('heart') + (S.ofav[o.id] ? 'Đã lưu' : 'Lưu') + '</button></div>');
  }

  /* ---------- Hồ sơ ---------- */
  function renderProfile() {
    var wears = S.items.reduce(function (a, i) { return a + i.wears; }, 0);
    var favs = S.items.filter(function (i) { return i.fav; });
    var h = '<div class="hd"><div><h1>Hồ sơ</h1><p class="sub">Tủ đồ của bạn đang làm việc chăm chỉ thế nào</p></div><span class="leaf-badge">' + ic('user') + '</span></div>' +
      '<button class="btn block" style="margin-bottom:14px" data-act="settings">' + ic('sliders') + ' Cài đặt giao diện & phong cách</button><div class="pstats"><div class="pstat"><b class="num">' + S.items.length + '</b><span>món trong tủ</span></div><div class="pstat"><b class="num">' + wears + '</b><span>lần mặc tổng</span></div><div class="pstat"><b class="num">' + S.sold.length + '</b><span>món đã trao tay</span></div></div>';
    h += '<div class="sec-row"><h2>Yêu thích</h2></div>' + (favs.length ? '<div class="cgrid" style="margin-bottom:18px">' + favs.map(function (it) {
      return '<button class="citem" data-act="open" data-id="' + it.id + '"><div class="ctile checker">' + pic(it) + '</div><div class="nm">' + esc(it.name) + '</div></button>';
    }).join('') + '</div>' : '<p class="sub" style="margin-bottom:18px">Chạm vào trái tim ở món đồ để lưu vào đây.</p>');
    h += '<div class="sec-row"><h2>Outfit đã lưu</h2></div>' + (S.saved.length ? '<div class="list">' + S.saved.map(function (s) {
      var its = s.ids.map(itemBy).filter(Boolean);
      return '<div class="lrow"><div class="thumbs">' + its.slice(0, 4).map(function (p) { return '<div class="th">' + pic(p) + '</div>'; }).join('') + '</div><div class="tx"><b>' + its.length + ' món</b><span class="sub">' + new Date(s.date).toLocaleDateString('vi-VN') + '</span></div></div>';
    }).join('') + '</div>' : '<p class="sub" style="margin-bottom:18px">Bấm "Lưu outfit" trong chi tiết outfit để giữ lại.</p>');
    h += '<div class="sec-row"><h2>Lịch sử mặc</h2></div>' + (S.log.length ? '<div class="list">' + S.log.slice(0, 6).map(function (s) {
      var its = s.ids.map(itemBy).filter(Boolean);
      return '<div class="lrow"><div class="thumbs">' + its.slice(0, 4).map(function (p) { return '<div class="th">' + pic(p) + '</div>'; }).join('') + '</div><div class="tx"><b>' + new Date(s.date).toLocaleDateString('vi-VN') + '</b><span class="sub">' + its.length + ' món</span></div></div>';
    }).join('') + '</div>' : '<p class="sub">Chưa có lịch sử. Bấm "Mặc hôm nay" ở trang chủ.</p>');
    h += '<div class="foot">Dữ liệu lưu ngay trên trình duyệt này. ' + (S.confirm === 'reset' ? '<button class="btn sm danger" data-act="reset2">Xác nhận đặt lại</button><button class="btn sm ghost" data-act="cancel">Huỷ</button>' : '<button class="btn sm ghost" data-act="reset">Đặt lại dữ liệu mẫu</button>') + '</div>';
    return h;
  }

  /* ---------- Hiển thị ---------- */
  function renderTabs() {
    var T = [['home', 'Trang chủ', 'home'], ['closet', 'Tủ đồ', 'closet'], ['add', 'Thêm', 'plus'], ['market', 'Marketplace', 'bag'], ['profile', 'Hồ sơ', 'user']];
    $('#tabs').innerHTML = T.map(function (t) {
      if (t[0] === 'add') return '<button class="plus" data-act="add" aria-label="Thêm đồ"><span class="c">' + ic('plus') + '</span>Thêm</button>';
      return '<button data-act="page" data-p="' + t[0] + '"' + (S.page === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2]) + t[1] + '</button>';
    }).join('');
  }
  function render() {
    var p = S.page;
    $('#view').innerHTML = p === 'home' ? renderHome() : p === 'closet' ? renderCloset() : p === 'market' ? renderMarket() : renderProfile();
    renderTabs();
  }
  function wearItems(ids) {
    var now = new Date().toISOString();
    ids.forEach(function (x) { var p = itemBy(x); if (p) { p.wears++; p.lastWorn = now; } });
    S.log.unshift({ date: now, ids: ids }); save();
  }
  function ids(o) { return o.parts.map(function (p) { return p.id; }); }

  /* ---------- Sự kiện ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.dataset.act, id = el.dataset.id, it, i, o;
    if (a === 'page') { S.page = el.dataset.p; S.confirm = ''; if (!$('#sheet').hidden) closeSheet(); render(); window.scrollTo(0, 0); }
    else if (a === 'filter') { S.filter = el.dataset.f; render(); }
    else if (a === 'gender-filter') { S.genderFilter = el.dataset.v; render(); }
    else if (a === 'mtab') { S.mtab = el.dataset.t; render(); }
    else if (a === 'mf') { S.mfilter = el.dataset.f; render(); }
    else if (a === 'add') addSheet();
    else if (a === 'settings') settingsSheet();
    else if (a === 'theme') { S.theme = el.dataset.v; applyAppearance(); save(); settingsSheet(); }
    else if (a === 'accent') { S.accent = el.dataset.v; applyAppearance(); save(); settingsSheet(); }
    else if (a === 'ui') { S.ui = el.dataset.v; applyAppearance(); save(); settingsSheet(); }
    else if (a === 'gender') { S.gender = el.dataset.v; save(); settingsSheet(); if (S.page === 'closet') render(); }
    else if (a === 'open') itemSheet(id);
    else if (a === 'oview') oviewSheet(id);
    else if (a === 'close') { S.confirm = ''; closeSheet(); }
    else if (a === 'shuffle') { S.aiSet = null; S.seed++; S.pick = 0; render(); }
    else if (a === 'pick') { S.aiSet = null; S.pick = +el.dataset.i; render(); window.scrollTo(0, 0); }
    else if (a === 'outfit') outfitSheet(el.dataset.i === 'ai' ? 'ai' : +el.dataset.i);
    else if (a === 'aimix') aiMix();
    else if (a === 'occ') { S.occ = S.occ === el.dataset.v ? '' : el.dataset.v; render(); }
    else if (a === 'clearai') { S.aiSet = null; render(); }
    else if (a === 'wearset') {
      var k0 = el.dataset.i === 'ai' ? 'ai' : +el.dataset.i;
      o = k0 === 'ai' ? aiOutfit() : buildOutfits().list[k0]; if (!o) return;
      wearItems(ids(o)); S.aiSet = null; S.seed++; S.pick = 0; closeSheet(); toast('Đã ghi nhận bộ đồ hôm nay. Chúc bạn một ngày vui!'); render();
    }
    else if (a === 'saveoutfit') {
      var k1 = el.dataset.i === 'ai' ? 'ai' : +el.dataset.i;
      o = k1 === 'ai' ? aiOutfit() : buildOutfits().list[k1]; if (!o) return;
      var key = ids(o).join();
      if (!S.saved.some(function (x) { return x.ids.join() === key; })) { S.saved.unshift({ ids: ids(o), date: new Date().toISOString() }); save(); toast('Đã lưu outfit vào Hồ sơ.'); }
      outfitSheet(k1);
    }
    else if (a === 'fav') {
      e.stopPropagation(); it = itemBy(id); it.fav = !it.fav; save();
      if (!$('#sheet').hidden && $('#sheet-panel').querySelector('.lrow')) { el.classList.toggle('on', it.fav); }
      else render();
    }
    else if (a === 'ofav') { if (S.ofav[id]) delete S.ofav[id]; else S.ofav[id] = 1; save(); if (el.dataset.keep) oviewSheet(id); else { el.classList.toggle('on', !!S.ofav[id]); } }
    else if (a === 'tgstyle') { var s = el.dataset.s; i = draft.styles.indexOf(s); if (i > -1) draft.styles.splice(i, 1); else draft.styles.push(s); el.setAttribute('aria-pressed', i === -1); }
    else if (a === 'updatephoto' || a === 'retakephoto') { var pf = $(a === 'updatephoto' ? '#item-photo-cam' : '#item-photo-file'); if (pf) { pf.dataset.itemId = id; pf.click(); } }
    else if (a === 'pickfile') $('#f-file').click();
    else if (a === 'shoot') $('#f-cam').click();
    else if (a === 'resetcrop') { if (draft.source) { $('#f-zoom').value = '1'; $('#f-crop').value = 'original'; applyCrop(); } }
    else if (a === 'saveitem') saveItem();
    else if (a === 'wear') { wearItems([id]); it = itemBy(id); toast('Đã ghi: mặc "' + it.name + '" hôm nay.'); render(); itemSheet(id); }
    else if (a === 'showlist') { $('#listform').hidden = false; el.hidden = true; }
    else if (a === 'startlist') startListSheet();
    else if (a === 'openlist') itemSheet(id, true);
    else if (a === 'dolist') {
      it = itemBy(id); it.listing = { mode: $('#l-mode').value, price: Math.max(0, +$('#l-price').value || 0), wish: $('#l-wish').value.trim() };
      save(); closeSheet(); S.page = 'market'; S.mtab = 'mine'; toast('Đã đăng "' + it.name + '" lên Marketplace.'); render(); window.scrollTo(0, 0);
    }
    else if (a === 'unlist') { it = itemBy(id); it.listing = null; save(); toast('Đã gỡ bài đăng.'); render(); itemSheet(id); }
    else if (a === 'sold') {
      it = itemBy(id); S.sold.unshift(Object.assign({}, it, { soldAt: new Date().toISOString() }));
      S.items = S.items.filter(function (x) { return x.id !== id; }); save(); closeSheet(); S.mtab = 'sold'; toast('Chúc mừng! Món đồ đã có chủ mới.'); render();
    }
    else if (a === 'del') { S.confirm = 'del:' + id; itemSheet(id); }
    else if (a === 'cancel-item') { S.confirm = ''; itemSheet(id); }
    else if (a === 'del2') { S.items = S.items.filter(function (x) { return x.id !== id; }); S.confirm = ''; save(); closeSheet(); toast('Đã xoá khỏi tủ đồ.'); render(); }
    else if (a === 'reset') { S.confirm = 'reset'; render(); }
    else if (a === 'reset2') { S.items = seedItems(); S.sold = []; S.saved = []; S.log = []; S.confirm = ''; S.filter = 'all'; S.genderFilter = 'all'; save(); toast('Đã đặt lại dữ liệu mẫu.'); render(); }
    else if (a === 'cancel') { S.confirm = ''; render(); }
    else if (a === 'wx') { S.weather = { t: +el.dataset.t, r: el.dataset.r === '1' }; save(); S.seed++; S.pick = 0; render(); settingsSheet(); }
    else if (a === 'style') { S.style = S.style === el.dataset.s ? '' : el.dataset.s; save(); S.pick = 0; render(); settingsSheet(); }
    else if (a === 'msg') toast('Bản thử nghiệm chưa có tin nhắn. Bản đầy đủ sẽ mở khung chat với ' + el.dataset.who + '.');
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if ((t.id === 'f-file' || t.id === 'f-cam') && t.files && t.files[0]) { onFile(t.files[0]); t.value = ''; }
    else if ((t.id === 'item-photo-file' || t.id === 'item-photo-cam') && t.files && t.files[0]) { replaceItemPhoto(t.dataset.itemId, t.files[0]); t.value = ''; }
    else if (t.id === 'f-bg') applyDraft();
    else if (t.id === 'f-crop') applyCrop();
    else if (t.id === 'f-color') draft.colorTouched = true;
    else if (t.id === 'l-mode') { $('#l-price-w').hidden = t.value === 'doi'; $('#l-wish-w').hidden = t.value !== 'doi'; }
    else if (t.id === 'item-gender') { var gi = itemBy(t.dataset.itemId); if (gi) { gi.gender = t.value; save(); if (S.page === 'closet') render(); toast('Đã cập nhật nhãn người mặc.'); } }
    else if (t.id === 'rain') { S.weather.r = t.checked; save(); S.seed++; S.pick = 0; render(); }
    else if (t.id === 'temp') { save(); S.seed++; S.pick = 0; render(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'temp') { S.weather.t = +t.value; $('#temp-out').textContent = S.weather.t + '°C'; }
    else if (t.id === 'f-sens') { clearTimeout(sensT); sensT = setTimeout(applyDraft, 120); }
    else if (t.id === 'f-zoom') { clearTimeout(sensT); sensT = setTimeout(applyCrop, 160); }
    else if (t.id === 'occ') S.occ = t.value;
    else if (t.id === 'q') { S.q = t.value; $('#cgrid').innerHTML = closetGrid(); }
    else if (t.id === 'mq') { S.mq = t.value; $('#mgrid').innerHTML = marketGrid(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

  load(); applyAppearance(); render();
})();
</script>

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
